[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwarrior"
# ⚠ 版本真值源是 blackwarrior/version.py 的 __version__。
# 这里必须与它一致——两者脱节过（包元数据停在 0.1.0 而代码已 0.3.0），
# 导致 `pip show blackwarrior` 显示的版本是假的。
# selftest 里有守卫（check_package_version），改版本时两边都要改。
version = "0.8.10"
description = "黑武士 BlackWarrior —— 带真实认知内核的持续运行桌面 AI Agent（PASM 认知引擎 × Electron 桌面壳）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "arronzheng" }]
keywords = ["agent", "ai", "pasm", "cognition", "electron", "desktop", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心零强制第三方依赖：标准库即可跑（离线优先，对齐 PASM 哲学）。
# PASM 认知内核为可选增强：装上才启用真内核，没装自动降级且明确标注档位。
dependencies = []

[project.optional-dependencies]
pasm = [
    "pasm-skills>=0.6.3",
    "pasm-framework>=0.5.4",
]
# V2 十九层底座（pasm2）的运行条件。
# pasm2 已发布 PyPI（2.0.0a12+）：pip install pasm2
# （旧法备用：pip install --no-deps git+https://gitee.com/arronzheng/PASM.git）
pasm2 = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://gitee.com/arronzheng/BlackWarrior"
Repository = "https://gitee.com/arronzheng/BlackWarrior"
Changelog = "https://gitee.com/arronzheng/BlackWarrior/blob/main/CHANGELOG.md"

[project.scripts]
blackwarrior = "blackwarrior.cli:main"

[tool.setuptools]
# 0.7.0 起用下方 packages.find 递归收录全部子包。

[tool.setuptools.packages.find]
include = ["blackwarrior*"]

[tool.setuptools.package-data]
blackwarrior = [
    "ui/static/*",
    "ui/static/css/*",
    "ui/static/js/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
