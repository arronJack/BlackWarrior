<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>黑武士 · 环境自检与修复</title>
<style>
  :root{
    --bg:#070a10; --panel:#0e131c; --line:#1e2836; --ink:#e8f0fa;
    --dim:#8fa3b8; --ok:#39ffb0; --warn:#ffb020; --block:#ff4d5e;
    --accent:#35e0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(53,224,255,.08), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:"HarmonyOS Sans SC","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    padding:38px 24px 60px; -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:860px;margin:0 auto}

  header{margin-bottom:26px}
  h1{font-size:23px;font-weight:600;letter-spacing:.03em;display:flex;
     align-items:center;gap:12px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);
          box-shadow:0 0 14px currentColor;flex:none}
  .sub{color:var(--dim);font-size:13px;margin-top:9px;line-height:1.7}
  .sub code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;
            font-family:Consolas,monospace;font-size:12px}

  /* 总览 */
  .summary{
    border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    background:var(--panel); margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .summary .txt b{font-size:15px}
  .summary .txt div{color:var(--dim);font-size:12.5px;margin-top:6px}

  button{
    font-family:inherit; cursor:pointer; border-radius:9px; font-size:13.5px;
    padding:9px 18px; border:1px solid currentColor; background:transparent;
    color:var(--ink); transition:all .16s; white-space:nowrap;
  }
  button:hover:not(:disabled){box-shadow:0 0 18px rgba(53,224,255,.22)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{color:var(--accent);border-color:var(--accent);
           background:rgba(53,224,255,.10)}
  .primary:hover:not(:disabled){background:rgba(53,224,255,.2)}

  /* 清单 */
  .item{
    border:1px solid var(--line); border-radius:12px; margin-bottom:10px;
    background:var(--panel); overflow:hidden;
    transition:border-color .2s;
  }
  .item.block{border-color:rgba(255,77,94,.42)}
  .item.warn{border-color:rgba(255,176,32,.34)}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px}
  .badge{
    width:26px;height:26px;border-radius:8px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;font-family:Consolas,monospace;
  }
  .ok .badge{background:rgba(57,255,176,.12);color:var(--ok)}
  .warn .badge{background:rgba(255,176,32,.12);color:var(--warn)}
  .block .badge{background:rgba(255,77,94,.13);color:var(--block)}
  .name{font-size:14.5px;font-weight:500}
  .detail{color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.65}
  .act{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
  .size{color:var(--dim);font-size:11.5px}

  /* 进度 */
  .prog{display:none;border-top:1px solid var(--line);padding:12px 16px;
        background:rgba(0,0,0,.24)}
  .prog.on{display:block}
  .prog .t{font-size:12px;color:var(--accent);margin-bottom:8px}
  .bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;
       overflow:hidden;margin-bottom:9px}
  .bar i{display:block;height:100%;width:35%;background:var(--accent);
         animation:sl 1.15s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .log{font-family:Consolas,monospace;font-size:11.5px;color:#93a7bb;
       max-height:130px;overflow:auto;line-height:1.7;white-space:pre-wrap}
  .log .ok{color:var(--ok)} .log .err{color:var(--block)}

  .foot{margin-top:22px;color:var(--dim);font-size:12px;line-height:1.85}
  .foot b{color:#c3d3e2}
  .shield{display:inline-block;width:8px;height:8px;border-radius:50%;
          background:var(--ok);margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot" id="hDot"></span>环境自检与修复</h1>
    <div class="sub">
      这一页会告诉你<b style="color:#c3d3e2">缺什么、缺了会怎样、装它要多少空间</b>。<br>
      数据目录：<code id="droot">…</code> · Python：<code id="dpy">…</code>
    </div>
  </header>

  <div class="summary">
    <div class="txt">
      <b id="sumTitle">正在体检…</b>
      <div id="sumSub">逐项检查依赖、模型与磁盘空间</div>
    </div>
    <button class="primary" id="btnAll">装齐缺失组件</button>
  </div>

  <div id="list"></div>

  <div class="foot">
    <span class="shield"></span><b>不会未经你同意就装任何东西。</b>
    每个安装都要你点一次按钮；点之前可以先看清它要装什么、多大、装去哪。<br>
    装语音组件请确保数据盘有 <b>600 MB</b> 空闲——大模型只下到本机，不联网推理。
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const GLYPH  = { ok:'✓', warn:'!', block:'×' };
const CSSLV  = { ok:'ok', warn:'warn', block:'block' };

async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const t = await r.text();
  try { return JSON.parse(t); } catch(_) { return {error:t}; }
}

let busy = new Set();

async function load() {
  const d = await api('/api/doctor');
  if (d.error) { $('sumTitle').textContent = '体检失败：' + d.error; return; }
  $('droot').textContent = d.data_root || '…';
  $('dpy').textContent = (d.python||'') + ' @ ' + (d.exe||'');

  const color = {ok:'#39ffb0', warn:'#ffb020', block:'#ff4d5e'};
  $('hDot').style.background = color[d.overall];
  $('hDot').style.color = color[d.overall];
  $('sumTitle').textContent = ({ok:'一切正常',warn:'核心可用，有组件未装',
                                block:'有功能不可用'}[d.overall] || d.overall);
  $('sumSub').textContent = d.summary || '';

  const fixable = (d.items||[]).filter(i => i.fix && i.level !== 'ok').length;
  $('btnAll').disabled = fixable === 0 || busy.size > 0;
  $('btnAll').textContent = fixable ? `装齐 ${fixable} 项缺失组件` : '无需安装';

  const box = $('list');
  box.innerHTML = '';
  (d.items||[]).forEach(it => box.appendChild(row(it)));
}

function row(it) {
  const el = document.createElement('div');
  const lv = CSSLV[it.level] || 'ok';
  el.className = 'item ' + lv;
  const glyph = GLYPH[it.level] || GLYPH.ok;
  const f = it.fix;

  const top = document.createElement('div');
  top.className = 'row';
  top.innerHTML = '<div class="badge">' + glyph + '</div>'
    + '<div><div class="name"></div><div class="detail"></div></div>';
  top.querySelector('.name').textContent = it.name;
  top.querySelector('.detail').textContent = it.detail;

  const act = document.createElement('div');
  act.className = 'act';
  if (f) {
    if (f.size_mb) {
      const s = document.createElement('span');
      s.className = 'size';
      s.textContent = '约 ' + f.size_mb + ' MB';
      act.appendChild(s);
    }
    const b = document.createElement('button');
    b.className = 'primary';
    b.textContent = f.label || '安装';
    if (f.note) b.title = f.note;
    b.onclick = () => run(it, fix, b, el, act);
    act.appendChild(b);
  }
  top.appendChild(act);
  el.appendChild(top);

  const prog = document.createElement('div');
  prog.className = 'prog';
  prog.innerHTML = '<div class="t">正在安装…</div><div class="bar"><i></i></div><div class="log"></div>';
  el.appendChild(prog);
  return el;
}

async function run(item, fix, btn, el, act) {
  if (busy.has(fix.label)) return;
  busy.add(fix.label);
  act.querySelectorAll('button').forEach(b => b.disabled = true);
  const prog = el.querySelector('.prog');
  prog.classList.add('on');
  const log = prog.querySelector('.log');
  const t = prog.querySelector('.t');
  t.textContent = '正在安装：' + (fix.label || '') + '…';

  const r = await api('/api/doctor/fix', {
    method:'POST', body: JSON.stringify({id: item.id})
  });
  if (r.error) {
    t.textContent = '✗ ' + r.error;
    log.innerHTML = '<span class="err">' + esc(r.error) + '</span>';
    busy.delete(fix.label);
    return;
  }
  const jobId = r.job_id;
  log.innerHTML = '';
  // 轮询进度：装大包要几分钟，没有进度用户会以为卡死
  const timer = setInterval(async () => {
    const j = await api('/api/doctor/jobs');
    const job = (j.jobs||[]).find(x => x.id === jobId);
    if (!job) return;
    log.innerHTML = (job.lines||[]).map(l =>
      '<div class="' + (l.startsWith('✓') ? 'ok' : '') + '">' + esc(l) + '</div>').join('');
    log.scrollTop = log.scrollHeight;
    if (job.state === 'ok') {
      clearInterval(timer);
      t.innerHTML = '<span class="ok">✓ 安装完成</span>';
      busy.delete(fix.label);
      setTimeout(load, 600);
    } else if (job.state === 'failed') {
      clearInterval(timer);
      t.innerHTML = '<span class="err">✗ 安装失败</span>';
      if (job.error) log.innerHTML += '<div class="err">' + esc(job.error) + '</div>';
      busy.delete(fix.label);
      act.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }, 1200);
}

$('btnAll').onclick = async () => {
  const d = await api('/api/doctor');
  const need = (d.items||[]).filter(i => i.fix && i.level !== 'ok');
  if (!need.length) return;
  // 串行执行：pip 同时跑多个会互相抢 site-packages 锁
  for (const it of need) {
    $('btnAll').disabled = true;
    await new Promise(res => {
      const el = [...document.querySelectorAll('.item')].find(
        e => e.querySelector('.name').textContent === it.name);
      if (!el) return res();
      const b = el.querySelector('.act button');
      b.onclick();
      const w = setInterval(async () => {
        const j = await api('/api/doctor/jobs');
        const done = (j.jobs||[]).some(x => x.state === 'ok' || x.state === 'failed');
        if (done) { clearInterval(w); res(); }
      }, 1500);
    });
  }
  $('btnAll').disabled = false;
  load();
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

load();
setInterval(() => { if (busy.size === 0) load(); }, 15000);
</script>
</body>
</html>
